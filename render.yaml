services:
  - type: web
    name: factagent-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: VECTOR_BACKEND
        value: pgvector
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"     # Replace with your Vercel URL in production
